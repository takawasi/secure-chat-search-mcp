[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-chat-search-mcp"
version = "0.1.0"
description = "権限を維持する日本語チャット履歴検索・MCPの参照実装"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.2,<1", "starlette>=0.50,<1", "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0.50,<3", "PyJWT[crypto]>=2.13,<3", "httpx>=0.28.1,<1"
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "playwright>=1.50,<2"]
[project.scripts]
chat-search = "secure_chat_search.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
secure_chat_search = ["web/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
