name: 初期依存の検証
on:
  push:
    paths: ['.github/workflows/bootstrap-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 公式MCP SDKを取得する
        run: |
          mkdir -p wheelhouse
          python -m pip download --no-deps --dest wheelhouse 'mcp>=1.26,<2' 'sse-starlette>=3,<4' 'httpx-sse>=0.4,<1'
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-sdk-wheels
          path: wheelhouse/
          retention-days: 1
